# Preset profiles for the "Key destinations" score: the app shows the weighted average
# travel time from the start point to a profile's places, and lets you switch profiles.
#
#   [<key>]                   a profile; the key is what the app's URL keeps
#   name, description         shown in the app
#   [<key>.groups."<group>"]  places and their weights, summarised per group. A place is
#                             an MRT/LRT station's name, or has coordinates:
#                             "Somewhere" = { weight = 2, lat = 1.3000, lon = 103.8000 }
#
# Weights can use any scale (the app shows shares of the profile's total); these sum to
# 100. A place can appear in several groups, and its weights add up. See README.md.


# The sample weights of the sibling project the-fastest-journey, copied unchanged from
# mrt_distance/mrt_distance.py, get_weights(): possible_general_raw_percentage_weights.
# Its category names are kept in the comments.
